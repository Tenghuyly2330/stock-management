name: HouseStock CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test-and-lint:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Execute Backend Unit & Route Tests
        run: npm --prefix backend test

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Execute Frontend Lint Check
        run: npm --prefix frontend run lint

      - name: Execute Frontend Production Build Check
        run: npm --prefix frontend run build

  deploy-cloud:
    name: Deploy to Render & Vercel
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Backend to Render (via Deploy Hook)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Dispatching Render deployment webhook..."
            curl -fsS -X POST "$RENDER_HOOK"
            echo "Render backend deployment trigger sent successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Render will deploy automatically via its connected GitHub repository."
          fi

      - name: Verify Vercel SPA Routing Configuration
        run: |
          echo "Vercel automatically deploys the frontend upon git push."
          if [ -f "frontend/vercel.json" ]; then
            echo "frontend/vercel.json found and verified:"
            cat frontend/vercel.json
          fi

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Backend
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stock-management-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/stock-management-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stock-management-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/stock-management-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


     