name: HouseStock CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test-and-lint:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Execute Backend Unit & Route Tests
        run: npm --prefix backend test

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Execute Frontend Lint Check
        run: npm --prefix frontend run lint

      - name: Execute Frontend Production Build Check
        run: npm --prefix frontend run build

  deploy-cloud:
    name: Deploy to Render & Vercel
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Backend to Render (via Deploy Hook)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Dispatching Render deployment webhook..."
            curl -fsS -X POST "$RENDER_HOOK"
            echo "Render backend deployment trigger sent successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Render will deploy automatically via its connected GitHub repository."
          fi

      - name: Verify Vercel SPA Routing Configuration
        run: |
          echo "Vercel automatically deploys the frontend upon git push."
          if [ -f "frontend/vercel.json" ]; then
            echo "frontend/vercel.json found and verified:"
            cat frontend/vercel.json
          fi

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name for Docker
        run: |
          echo "IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Backend Image Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Frontend Image Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
