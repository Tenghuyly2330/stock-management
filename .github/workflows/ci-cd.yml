name: StockSync CI/CD Pipeline (Render & Vercel)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # =========================================================================
  # 1. TEST & LINT (Runs on all Pull Requests and Pushes)
  # =========================================================================
  test-and-lint:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 3. Install Backend Dependencies
        run: npm --prefix backend ci

      - name: 4. Execute Backend Unit & Route Tests
        run: npm --prefix backend test

      - name: 5. Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: 6. Execute Frontend Lint Check
        run: npm --prefix frontend run lint

      - name: 7. Execute Frontend Production Build Check
        run: npm --prefix frontend run build

  # =========================================================================
  # 2. CLOUD DEPLOY (Render Backend & Vercel Frontend)
  # =========================================================================
  deploy-cloud:
    name: Deploy to Render & Vercel
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Deploy Backend to Render (via Deploy Hook)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "🚀 Dispatching Render deployment webhook..."
            curl -fsS -X POST "$RENDER_HOOK"
            echo "✅ Render backend deployment trigger sent successfully!"
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not set. Render will deploy automatically via its connected GitHub repository."
          fi

      - name: 3. Verify Vercel SPA Routing Configuration
        run: |
          echo "🚀 Vercel automatically deploys the frontend upon git push."
          if [ -f "frontend/vercel.json" ]; then
            echo "✅ frontend/vercel.json found and verified:"
            cat frontend/vercel.json
          fi

  # =========================================================================
  # 3. DOCKER BUILD & CONTAINER REGISTRY (Optional / Backup)
  # =========================================================================
  build-and-push-docker:
    name: Build & Push Docker Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Authenticate with GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Extract Backend Image Metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 5. Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Extract Frontend Image Metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 7. Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
