        value: ds7w2aznz
      - key: CLOUDINARY_API_KEY
        value: "263134127278318"
      - key: CLOUDINARY_API_SECRET
        value: dG-rWWvaktUUOhTFdOWDSjeyh28
      - key: CLOUDINARY_FOLDER
        value: stock
